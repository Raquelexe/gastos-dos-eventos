<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema de Eventos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial; background: #f0f0f0; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
h1 { text-align: center; margin-bottom: 20px; color: #333; }
.section { margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; }
.section h2 { color: #1976d2; margin-bottom: 10px; }
.form-group { margin-bottom: 10px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
.row { display: flex; gap: 10px; margin-bottom: 10px; }
.row > div { flex: 1; }
button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
button:hover { background: #45a049; }
#resultado { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
.sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>
</head>
<body>

<div class="container">
  <h1>📋 Registro de Eventos</h1>
  
  <form id="meuForm">
    
    <div class="section">
      <h2>Dados do Evento</h2>
      <div class="row">
        <div class="form-group">
          <label>Protocolo:</label>
          <input type="text" id="protocolo" value="EV-2024-001" required>
        </div>
        <div class="form-group">
          <label>Data do Evento:</label>
          <input type="date" id="data_evento" required>
        </div>
      </div>
      <div class="form-group">
        <label>Nome do Evento:</label>
        <input type="text" id="evento" value="Evento Teste" required>
      </div>
      <div class="form-group">
        <label>Local:</label>
        <input type="text" id="local" value="Local Teste" required>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Área do Evento (m²):</label>
          <input type="number" id="area_m2" value="2350" min="0" step="0.1">
        </div>
        <div class="form-group">
          <label>Tipo de Área:</label>
          <select id="tipo_area">
            <option value="externo">Área Externa (AD)</option>
            <option value="interno">Área Interna (AC)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Observações:</label>
        <textarea id="observacoes" rows="3" placeholder="Descrição do evento, contexto, fase da obra..."></textarea>
      </div>
    </div>
    
    <div class="section">
      <h2>Placas</h2>
      <div class="row">
        <div class="form-group">
          <label>R-4a:</label>
          <input type="number" id="r4a" value="2" min="0">
        </div>
        <div class="form-group">
          <label>R-4b:</label>
          <input type="number" id="r4b" value="1" min="0">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>R-6a:</label>
          <input type="number" id="r6a" value="3" min="0">
        </div>
        <div class="form-group">
          <label>R-6c:</label>
          <input type="number" id="r6c" value="1" min="0">
        </div>
      </div>
    </div>
    
    <div class="section">
      <h2>Equipamentos</h2>
      <div class="row">
        <div class="form-group">
          <label>Cone:</label>
          <input type="number" id="cone" value="10" min="0">
        </div>
        <div class="form-group">
          <label>Cavalete:</label>
          <input type="number" id="cavalete" value="5" min="0">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Fita (metros):</label>
          <input type="number" id="fita" value="50" min="0" step="0.5">
        </div>
        <div class="form-group">
          <label>PMV (horas):</label>
          <input type="number" id="pmv" value="8" min="0" step="0.5">
        </div>
      </div>
    </div>
    
    <div class="section">
      <h2>Recursos</h2>
      <div class="row">
        <div class="form-group">
          <label>Agentes:</label>
          <input type="number" id="agentes" value="4" min="0">
        </div>
        <div class="form-group">
          <label>Horas Agentes:</label>
          <input type="number" id="horas_agentes" value="8" min="0" step="0.5">
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Carros:</label>
          <input type="number" id="carro_qtd" value="2" min="0">
        </div>
        <div class="form-group">
          <label>Horas Carros:</label>
          <input type="number" id="carro_horas" value="8" min="0" step="0.5">
        </div>
      </div>
    </div>
    
    <button type="button" onclick="enviarDados()">📤 ENVIAR PARA PLANILHA</button>
    
    <div id="resultado"></div>
  </form>
</div>

<script>
function enviarDados() {
  var dados = {
    protocolo: document.getElementById('protocolo').value,
    evento: document.getElementById('evento').value,
    local: document.getElementById('local').value,
    data_evento: document.getElementById('data_evento').value,
    area_m2: document.getElementById('area_m2').value || 0,
    tipo_area: document.getElementById('tipo_area').value,
    observacoes: document.getElementById('observacoes').value || '',
    r4a: document.getElementById('r4a').value || 0,
    r4b: document.getElementById('r4b').value || 0,
    r6a: document.getElementById('r6a').value || 0,
    r6c: document.getElementById('r6c').value || 0,
    cone: document.getElementById('cone').value || 0,
    cavalete: document.getElementById('cavalete').value || 0,
    fita: document.getElementById('fita').value || 0,
    pmv: document.getElementById('pmv').value || 0,
    agentes: document.getElementById('agentes').value || 0,
    horas_agentes: document.getElementById('horas_agentes').value || 0,
    carro_qtd: document.getElementById('carro_qtd').value || 0,
    carro_horas: document.getElementById('carro_horas').value || 0,
    moto_qtd: 0,
    moto_horas: 0,
    balizador_cilindrico: 0,
    balizador_conico: 0,
    barreira_pantografica: 0,
    barreira_plastica: 0,
    pilarete: 0,
    placa_1m2: 0,
    r25a: 0,
    r25b: 0,
    r3: 0
  };
  
  var resultado = document.getElementById('resultado');
  resultado.style.display = 'none';
  
  var form = document.createElement('form');
  form.method = 'GET';
  form.action = 'https://script.google.com/macros/s/AKfycbxEbN2yonm9-TJapAOw0yFpV_5id_lA0dWyXKpL36sJh7U8W-VfphndKms814T9WYlYLg/exec';
  
  for (var key in dados) {
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = dados[key];
    form.appendChild(input);
  }
  
  var acaoInput = document.createElement('input');
  acaoInput.type = 'hidden';
  acaoInput.name = 'acao';
  acaoInput.value = 'salvar';
  form.appendChild(acaoInput);
  
  document.body.appendChild(form);
  form.submit();
  
  resultado.innerHTML = '<div class="sucesso"><h3>✅ DADOS ENVIADOS!</h3><p>Verifique sua planilha Google.</p><p><a href="https://docs.google.com/spreadsheets/d/1OLBd15n1dKoPWmUkHTZOJT7Rh4OG5WYvgCUAgAUW5jQ/edit" target="_blank">📊 Abrir Planilha</a></p></div>';
  resultado.style.display = 'block';
  
  setTimeout(function() {
    document.getElementById('protocolo').value = 'EV-2024-' + (parseInt(document.getElementById('protocolo').value.split('-')[2]) + 1).toString().padStart(3, '0');
    document.getElementById('evento').value = '';
    document.getElementById('local').value = '';
    document.getElementById('observacoes').value = '';
  }, 3000);
}

window.onload = function() {
  var hoje = new Date().toISOString().split('T')[0];
  document.getElementById('data_evento').value = hoje;
};
</script>

</body>
</html>
