<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Cálculo de Custo de Sinalização</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  
  .container {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  
  .header {
    background: linear-gradient(135deg, #2575fc 0%, #1a5fd8 100%);
    color: white;
    padding: 25px 30px;
    text-align: center;
  }
  
  .header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
  }
  
  .header p {
    margin: 10px 0 0;
    opacity: 0.9;
    font-size: 16px;
  }
  
  .form-container {
    padding: 30px;
  }
  
  .section {
    margin-bottom: 35px;
    border-left: 5px solid #2575fc;
    padding-left: 20px;
    background: #f8f9ff;
    border-radius: 0 10px 10px 0;
    padding: 20px;
  }
  
  .section-title {
    color: #2575fc;
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
    font-size: 14px;
  }
  
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s;
    box-sizing: border-box;
  }
  
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #2575fc;
    box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.1);
  }
  
  .material-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
  }
  
  .material-item {
    background: white;
    border: 2px solid #e8eaf6;
    border-radius: 10px;
    padding: 15px;
    transition: all 0.3s;
  }
  
  .material-item:hover {
    border-color: #2575fc;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(37, 117, 252, 0.1);
  }
  
  .counter {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  
  .counter button {
    width: 40px;
    height: 40px;
    border: none;
    background: #2575fc;
    color: white;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  
  .counter button:hover {
    background: #1a5fd8;
  }
  
  .counter input {
    flex: 1;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
  }
  
  .btn-submit {
    display: block;
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 30px;
  }
  
  .btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(106, 17, 203, 0.3);
  }
  
  .btn-submit:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  #mensagem {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    display: none;
    text-align: center;
  }
  
  .sucesso {
    background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
    color: #155724;
    border: 2px solid #155724;
  }
  
  .erro {
    background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
    color: #721c24;
    border: 2px solid #721c24;
  }
  
  .info {
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
    color: #1565c0;
    border: 2px solid #1565c0;
  }
  
  .link-planilha {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 25px;
    background: #34a853;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.3s;
  }
  
  .link-planilha:hover {
    background: #2e8b47;
    transform: translateY(-2px);
  }
  
  .status {
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    background: #f0f7ff;
    margin-top: 10px;
    color: #2575fc;
  }
  
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid #f3f3f3;
    border-top: 3px solid #2575fc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 10px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📋 SISTEMA DE CÁLCULO DE CUSTO DE SINALIZAÇÃO</h1>
    <p>Preencha os dados abaixo para gerar automaticamente a planilha de custos</p>
  </div>
  
  <div class="form-container">
    <form id="formEvento">
      
      <!-- DADOS DO EVENTO -->
      <div class="section">
        <h2 class="section-title">📄 DADOS DO EVENTO</h2>
        <div class="grid">
          <div class="form-group">
            <label>🔖 Protocolo *</label>
            <input type="text" name="protocolo" required placeholder="Ex: EV-2024-001" id="protocolo">
          </div>
          <div class="form-group">
            <label>📅 Data do Evento *</label>
            <input type="date" name="data_evento" required id="data_evento">
          </div>
          <div class="form-group">
            <label>🏷️ Nome do Evento *</label>
            <input type="text" name="evento" required placeholder="Nome completo do evento">
          </div>
          <div class="form-group">
            <label>📍 Local do Evento *</label>
            <input type="text" name="local" required placeholder="Endereço completo">
          </div>
        </div>
      </div>
      
      <!-- PLACAS DE SINALIZAÇÃO -->
      <div class="section">
        <h2 class="section-title">🛠️ PLACAS DE SINALIZAÇÃO</h2>
        <div class="material-grid">
          <div class="material-item">
            <label>Placa R-4a</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r4a">-</button>
              <input type="number" name="r4a" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r4a">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-4b</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r4b">-</button>
              <input type="number" name="r4b" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r4b">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-6a</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r6a">-</button>
              <input type="number" name="r6a" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r6a">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-6c</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r6c">-</button>
              <input type="number" name="r6c" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r6c">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-25a</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r25a">-</button>
              <input type="number" name="r25a" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r25a">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-25b</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r25b">-</button>
              <input type="number" name="r25b" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r25b">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Placa R-3</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="r3">-</button>
              <input type="number" name="r3" min="0" value="0">
              <button type="button" class="btn-increment" data-field="r3">+</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- EQUIPAMENTOS -->
      <div class="section">
        <h2 class="section-title">🚧 EQUIPAMENTOS DE SINALIZAÇÃO</h2>
        <div class="grid">
          <div class="material-item">
            <label>Cone</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="cone">-</button>
              <input type="number" name="cone" min="0" value="0">
              <button type="button" class="btn-increment" data-field="cone">+</button>
            </div>
          </div>
          <div class="material-item">
            <label>Cavalete</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="cavalete">-</button>
              <input type="number" name="cavalete" min="0" value="0">
              <button type="button" class="btn-increment" data-field="cavalete">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Fita Zebra (metros)</label>
            <input type="number" name="fita" min="0" value="0" placeholder="Metros">
          </div>
          <div class="material-item">
            <label>Barreira</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="barreira">-</button>
              <input type="number" name="barreira" min="0" value="0">
              <button type="button" class="btn-increment" data-field="barreira">+</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- EQUIPAMENTOS ESPECIAIS -->
      <div class="section">
        <h2 class="section-title">📟 EQUIPAMENTOS ESPECIAIS</h2>
        <div class="grid">
          <div class="form-group">
            <label>PMV - Painel Mensagem Variável (horas)</label>
            <input type="number" name="pmv" min="0" value="0" step="0.5" placeholder="Horas">
          </div>
          <div class="material-item">
            <label>Placa de Sinalização (1m²)</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="placa_1m2">-</button>
              <input type="number" name="placa_1m2" min="0" value="0">
              <button type="button" class="btn-increment" data-field="placa_1m2">+</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- RECURSOS HUMANOS -->
      <div class="section">
        <h2 class="section-title">👥 RECURSOS HUMANOS</h2>
        <div class="grid">
          <div class="material-item">
            <label>Quantidade de Agentes</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="agentes">-</button>
              <input type="number" name="agentes" min="0" value="0">
              <button type="button" class="btn-increment" data-field="agentes">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Horas de Atuação</label>
            <input type="number" name="horas_agentes" min="0" value="0" step="0.5" placeholder="Horas">
          </div>
        </div>
      </div>
      
      <!-- VEÍCULOS -->
      <div class="section">
        <h2 class="section-title">🚗 VEÍCULOS</h2>
        <div class="grid">
          <div class="material-item">
            <label>Carro (Pickup) - Quantidade</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="carro_qtd">-</button>
              <input type="number" name="carro_qtd" min="0" value="0">
              <button type="button" class="btn-increment" data-field="carro_qtd">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Horas de Uso - Carro</label>
            <input type="number" name="carro_horas" min="0" value="0" step="0.5" placeholder="Horas">
          </div>
          <div class="material-item">
            <label>Moto - Quantidade</label>
            <div class="counter">
              <button type="button" class="btn-decrement" data-field="moto_qtd">-</button>
              <input type="number" name="moto_qtd" min="0" value="0">
              <button type="button" class="btn-increment" data-field="moto_qtd">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Horas de Uso - Moto</label>
            <input type="number" name="moto_horas" min="0" value="0" step="0.5" placeholder="Horas">
          </div>
        </div>
      </div>
      
      <!-- LOTAÇÃO -->
      <div class="section">
        <h2 class="section-title">📏 CÁLCULO DE LOTAÇÃO</h2>
        <div class="grid">
          <div class="form-group">
            <label>Área do Evento (m²)</label>
            <input type="number" name="area_m2" min="0" value="0" step="0.01" placeholder="m²">
          </div>
          <div class="form-group">
            <label>Tipo de Área</label>
            <select name="tipo_area">
              <option value="externa">Área Externa/Descoberta</option>
              <option value="interna">Área Interna/Coberta</option>
            </select>
          </div>
        </div>
      </div>
      
      <!-- BOTÃO ENVIAR -->
      <button type="submit" class="btn-submit" id="btnEnviar">
        <span id="btnText">📤 GERAR PLANILHA DE CUSTOS</span>
        <span class="loading" id="loading" style="display:none;"></span>
      </button>
      
      <!-- MENSAGEM -->
      <div id="mensagem"></div>
      
      <!-- STATUS -->
      <div class="status" id="status">
        🔄 Aguardando envio...
      </div>
    </form>
  </div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbycSOsVoN_kxRsP2xVBHsIhGIvT0a6cczRsTpog1VwXv7I0BtR3asZQAXRf4FuUICri7g/exec";
document.querySelectorAll('.btn-increment').forEach(btn => {
  btn.addEventListener('click', () => {
    const field = btn.getAttribute('data-field');
    const input = document.querySelector(`input[name="${field}"]`);
    input.value = parseInt(input.value) + 1;
    input.dispatchEvent(new Event('change'));
  });
});

document.querySelectorAll('.btn-decrement').forEach(btn => {
  btn.addEventListener('click', () => {
    const field = btn.getAttribute('data-field');
    const input = document.querySelector(`input[name="${field}"]`);
    if (parseInt(input.value) > 0) {
      input.value = parseInt(input.value) - 1;
      input.dispatchEvent(new Event('change'));
    }
  });
});

// Configurar data atual
window.addEventListener('load', () => {
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById('data_evento').value = hoje;
  
  // Gerar protocolo automático se vazio
  const protocoloInput = document.getElementById('protocolo');
  if (!protocoloInput.value) {
    const ano = new Date().getFullYear();
    const mes = (new Date().getMonth() + 1).toString().padStart(2, '0');
    const dia = new Date().getDate().toString().padStart(2, '0');
    protocoloInput.value = `EV-${ano}${mes}${dia}-001`;
  }
  
  // Testar conexão inicial
  testarConexao();
});

// Testar conexão com o servidor
async function testarConexao() {
  const status = document.getElementById('status');
  status.innerHTML = '🔄 Testando conexão...';
  
  try {
    const response = await fetch(URL);
