<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema de Eventos - Completo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial; background: #f0f0f0; padding: 20px; }
.container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
h1 { text-align: center; margin-bottom: 20px; color: #333; }
.section { margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; border-left: 5px solid #1976d2; }
.section h2 { color: #1976d2; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
.form-group { margin-bottom: 10px; }
label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
.row { display: flex; gap: 10px; margin-bottom: 10px; }
.row > div { flex: 1; }
button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
button:hover { background: #45a049; }
#resultado { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
.sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.item-group { background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #eee; }
</style>
</head>
<body>

<div class="container">
  <h1>📋 Registro Completo de Eventos</h1>
  
  <form id="meuForm">
    
    <!-- DADOS DO EVENTO -->
    <div class="section">
      <h2>📄 Dados do Evento</h2>
      <div class="row">
        <div class="form-group">
          <label>Protocolo:</label>
          <input type="text" id="protocolo" value=" " required>
        </div>
        <div class="form-group">
          <label>Data do Evento:</label>
          <input type="date" id="data_evento" required>
        </div>
      </div>
      <div class="form-group">
        <label>Nome do Evento:</label>
        <input type="text" id="evento" value=" " required>
      </div>
      <div class="form-group">
        <label>Local do Evento:</label>
        <input type="text" id="local" value=" " required>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Área do Evento (m²):</label>
          <input type="number" id="area_m2" value="2350" min="0" step="0.1" required>
        </div>
        <div class="form-group">
          <label>Tipo de Área:</label>
          <select id="tipo_area" required>
            <option value="externo">Área Externa (AD)</option>
            <option value="interno">Área Interna (AC)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Observações (descrição do evento):</label>
        <textarea id="observacoes" rows="3" placeholder="Descreva o evento, contexto, problemas, particularidades..." required></textarea>
      </div>
    </div>

    <!-- SINALIZAÇÃO - ITENS DA PLANILHA -->
    <div class="section">
      <h2>🚧 Sinalização - Itens da Planilha</h2>
      
      <h3>🧱 Barreiras e Balizadores</h3>
      <div class="grid-3">
        <div class="item-group">
          <label>Balizador cilíndrico (cone barril):</label>
          <input type="number" id="balizador_cilindrico" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Balizador cônico (M0048):</label>
          <input type="number" id="balizador_conico" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Barreira pantográfica (M0055):</label>
          <input type="number" id="barreira_pantografica" value="0" min="0">
        </div>
      </div>
      
      <div class="grid-3">
        <div class="item-group">
          <label>Barreira plástica horizontal (M0045):</label>
          <input type="number" id="barreira_plastica" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Cone (M0047):</label>
          <input type="number" id="cone" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Fita zebrada metros (M0054):</label>
          <input type="number" id="fita" value="0" min="0" step="0.5">
        </div>
      </div>
      
      <div class="grid-3">
        <div class="item-group">
          <label>Pilarete para fixação:</label>
          <input type="number" id="pilarete" value="0" min="0">
        </div>
      </div>
      
      <h3>🛑 Cavaletes de Sinalização</h3>
      <div class="grid-3">
        <div class="item-group">
          <label>Cavalete desvio à direita (M0771):</label>
          <input type="number" id="cavalete_direita" value="2" min="0">
        </div>
        <div class="item-group">
          <label>Cavalete desvio à esquerda (M0771):</label>
          <input type="number" id="cavalete_esquerda" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Cavalete trânsito impedido (M0771):</label>
          <input type="number" id="cavalete_impedido" value="0" min="0">
        </div>
      </div>
      
      <h3>📋 Placas de Sinalização</h3>
      <div class="grid-4">
        <div class="item-group">
          <label>Placa 1m² (ED-28429/10368):</label>
          <input type="number" id="placa_1m2" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-25a:</label>
          <input type="number" id="r25a" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-25b:</label>
          <input type="number" id="r25b" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-3:</label>
          <input type="number" id="r3" value="0" min="0">
        </div>
      </div>
      
      <div class="grid-4">
        <div class="item-group">
          <label>Placa R-4a:</label>
          <input type="number" id="r4a" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-4b:</label>
          <input type="number" id="r4b" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-6a:</label>
          <input type="number" id="r6a" value="0" min="0">
        </div>
        <div class="item-group">
          <label>Placa R-6c:</label>
          <input type="number" id="r6c" value="0" min="0">
        </div>
      </div>
      
      <h3>🖥️ Painel de Mensagem Variável (PMV)</h3>
      <div class="row">
        <div class="form-group">
          <label>PMV - Quantidade de horas:</label>
          <input type="number" id="pmv" value="0" min="0" step="0.5" required>
        </div>
      </div>
    </div>

    <!-- RECURSOS HUMANOS E VEÍCULOS -->
    <div class="section">
      <h2>👥 Recursos Humanos e Veículos</h2>
      
      <h3>👮 Agentes de Trânsito</h3>
      <div class="row">
        <div class="form-group">
          <label>Quantidade de Agentes:</label>
          <input type="number" id="agentes" value="0" min="0" required>
        </div>
        <div class="form-group">
          <label>Horas por Agente:</label>
          <input type="number" id="horas_agentes" value="0" min="0" step="0.5" required>
        </div>
      </div>
      
      <h3>🚗 Veículos</h3>
      <div class="row">
        <div class="form-group">
          <label>Carros (Pickup) - Quantidade:</label>
          <input type="number" id="carro_qtd" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Horas por Carro:</label>
          <input type="number" id="carro_horas" value="0" min="0" step="0.5">
        </div>
      </div>
      
      <div class="row">
        <div class="form-group">
          <label>Motos - Quantidade:</label>
          <input type="number" id="moto_qtd" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Horas por Moto:</label>
          <input type="number" id="moto_horas" value="0" min="0" step="0.5">
        </div>
      </div>
    </div>

    <button type="button" onclick="enviarDados()">📤 ENVIAR PARA PLANILHA GOOGLE SHEETS</button>
    
    <div id="resultado"></div>
  </form>
</div>

<script>
function enviarDados() {
  var dados = {
    protocolo: document.getElementById('protocolo').value,
    evento: document.getElementById('evento').value,
    local: document.getElementById('local').value,
    data_evento: document.getElementById('data_evento').value,
    area_m2: document.getElementById('area_m2').value || 0,
    tipo_area: document.getElementById('tipo_area').value,
    observacoes: document.getElementById('observacoes').value || '',
  
    balizador_cilindrico: document.getElementById('balizador_cilindrico').value || 0,
    balizador_conico: document.getElementById('balizador_conico').value || 0,
    barreira_pantografica: document.getElementById('barreira_pantografica').value || 0,
    barreira_plastica: document.getElementById('barreira_plastica').value || 0,
    cone: document.getElementById('cone').value || 0,
    fita: document.getElementById('fita').value || 0,
    pilarete: document.getElementById('pilarete').value || 0,
    
    cavalete_direita: document.getElementById('cavalete_direita').value || 0,
    cavalete_esquerda: document.getElementById('cavalete_esquerda').value || 0,
    cavalete_impedido: document.getElementById('cavalete_impedido').value || 0,
    
    placa_1m2: document.getElementById('placa_1m2').value || 0,
    r25a: document.getElementById('r25a').value || 0,
    r25b: document.getElementById('r25b').value || 0,
    r3: document.getElementById('r3').value || 0,
    r4a: document.getElementById('r4a').value || 0,
    r4b: document.getElementById('r4b').value || 0,
    r6a: document.getElementById('r6a').value || 0,
    r6c: document.getElementById('r6c').value || 0,
   
    pmv: document.getElementById('pmv').value || 0,
    
    agentes: document.getElementById('agentes').value || 0,
    horas_agentes: document.getElementById('horas_agentes').value || 0,
    carro_qtd: document.getElementById('carro_qtd').value || 0,
    carro_horas: document.getElementById('carro_horas').value || 0,
    moto_qtd: document.getElementById('moto_qtd').value || 0,
    moto_horas: document.getElementById('moto_horas').value || 0
  };
  
  if (!dados.protocolo || !dados.evento || !dados.local || !dados.data_evento) {
    alert("Preencha todos os campos obrigatórios!");
    return;
  }
  
  var resultado = document.getElementById('resultado');
  resultado.style.display = 'none';
  
  var form = document.createElement('form');
  form.method = 'GET';
  form.action = 'https://script.google.com/macros/s/AKfycbwthR3TocBv_VtsZVlJdVbPJZh5B-fbT6dmsEskJBDy9Y69KCwFwm5JUW0py1dS0nqQdA/exec';
  
  for (var key in dados) {
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = dados[key];
    form.appendChild(input);
  }
  
  var acaoInput = document.createElement('input');
  acaoInput.type = 'hidden';
  acaoInput.name = 'acao';
  acaoInput.value = 'salvar';
  form.appendChild(acaoInput);
  
  document.body.appendChild(form);
  form.submit();
  
  resultado.innerHTML = '<div class="sucesso"><h3>✅ DADOS ENVIADOS COM SUCESSO!</h3>' +
    '<p>Protocolo: <strong>' + dados.protocolo + '</strong></p>' +
    '<p>Evento: <strong>' + dados.evento + '</strong></p>' +
    '<p><a href="https://docs.google.com/spreadsheets/d/1OLBd15n1dKoPWmUkHTZOJT7Rh4OG5WYvgCUAgAUW5jQ/edit" target="_blank">📊 Abrir Planilha Google Sheets</a></p>' +
    '<p><em>Os dados foram enviados e uma nova aba foi criada com o protocolo.</em></p></div>';
  resultado.style.display = 'block';
 
  setTimeout(function() {
    var numAtual = parseInt(document.getElementById('protocolo').value.split('-')[2]);
    var novoNum = isNaN(numAtual) ? 2 : numAtual + 1;
    document.getElementById('protocolo').value = 'EV-2024-' + novoNum.toString().padStart(3, '0');
    
    document.getElementById('observacoes').value = '';
    document.getElementById('evento').value = '';
    document.getElementById('local').value = '';

    window.scrollTo(0, 0);
  }, 3000);
}

window.onload = function() {
  var hoje = new Date().toISOString().split('T')[0];
  document.getElementById('data_evento').value = hoje;
  
  document.getElementById('observacoes').value = 'Descrição do evento, contexto, fase da obra, particularidades da sinalização necessária...';
};
</script>

</body>
</html>
